name: Dependency Release & GHCR Push

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Testmodus"
        required: true
        default: dry-run-build
        type: choice
        options:
          - dry-run-build
          - rebuild-existing-tag
      tag:
        description: "Bestaande tag om opnieuw te bouwen (alleen bij rebuild-existing-tag)"
        required: false
        default: v1.06.01
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version-and-build:
    runs-on: ubuntu-latest
    # Push: alleen Renovate/dependency-commits. Handmatig: workflow_dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        (
          github.actor == 'renovate[bot]' ||
          github.actor == 'renovate-bot' ||
          startsWith(github.event.head_commit.message, 'chore(deps)') ||
          startsWith(github.event.head_commit.message, 'fix(deps)') ||
          contains(github.event.head_commit.message, 'renovate')
        )
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'rebuild-existing-tag' && inputs.tag || github.ref }}

      - name: Bepaal versienummer
        id: versioning
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "rebuild-existing-tag" ]; then
              NEW_TAG="${{ inputs.tag }}"
              NEW_TAG="${NEW_TAG#v}"
              NEW_TAG="${NEW_TAG#.}"
              NEW_TAG="v${NEW_TAG}"
              WITHOUT_V="${NEW_TAG#v}"
              NEW_VERSION="${WITHOUT_V}"
              echo "Handmatige rebuild van bestaande tag: $NEW_TAG"
            else
              NEW_TAG="test-build"
              NEW_VERSION="0.0.0-test"
              echo "Dry-run build (geen push naar GHCR)"
            fi
          else
            LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v\.?[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
            if [ -z "${LATEST_TAG}" ]; then
              LATEST_TAG="v1.06.00"
            fi
            echo "Laatste tag: $LATEST_TAG"

            # v1.06.01 or legacy v.1.06.01 → 1.06.01
            WITHOUT_V="${LATEST_TAG#v}"
            WITHOUT_V="${WITHOUT_V#.}"
            IFS='.' read -r MAJOR FEATURE PATCH <<< "${WITHOUT_V}"
            MAJOR="${MAJOR:-1}"
            FEATURE="${FEATURE:-0}"
            PATCH="${PATCH:-0}"

            FEATURE=$((10#$FEATURE))
            PATCH=$((10#$PATCH))
            PATCH=$((PATCH + 1))

            NEW_TAG=$(printf "v%d.%02d.%02d" "$MAJOR" "$FEATURE" "$PATCH")
            NEW_VERSION=$(printf "%d.%02d.%02d" "$MAJOR" "$FEATURE" "$PATCH")
            echo "Nieuwe dependency-release tag: $NEW_TAG"
          fi

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" = "dry-run-build" ]; then
            echo "PUSH_IMAGE=false" >> "$GITHUB_ENV"
          else
            echo "PUSH_IMAGE=true" >> "$GITHUB_ENV"
          fi

      - name: Sync package.json versions
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          for pkg in frontend/package.json backend/package.json; do
            if [ -f "$pkg" ]; then
              tmp=$(mktemp)
              jq --arg v "$NEW_VERSION" '.version = $v' "$pkg" > "$tmp"
              mv "$tmp" "$pkg"
            fi
          done

      - name: Commit version bump (if changed)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json backend/package.json
          if git diff --staged --quiet; then
            echo "Geen version-wijzigingen om te committen"
          else
            git commit -m "chore(release): ${NEW_TAG}"
            git push
          fi

      - name: Genereer GitHub Release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${NEW_TAG}" \
            --generate-notes \
            --title "Nexo Share ${NEW_TAG}" \
            --notes "Automatic dependency update release (${NEW_TAG})."

      - name: Log in to GHCR
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.NEW_TAG }}
            ghcr.io/${{ env.REPO }}:latest

      # New GHCR packages are private by default — anonymous `podman pull` / `docker pull` fails with 401.
      - name: Make GHCR package public
        if: env.PUSH_IMAGE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG="${REPO##*/}"
          API="orgs/${{ github.repository_owner }}/packages/container/${PKG}"
          VIS=$(gh api "$API" --jq '.visibility' 2>/dev/null || echo "unknown")
          echo "GHCR ${{ github.repository_owner }}/${PKG} visibility: ${VIS}"
          if [ "$VIS" = "public" ]; then
            echo "Already public."
            exit 0
          fi
          gh api --method PATCH "$API" -f visibility=public
          echo "Package is now public."
