name: Dependency Release & GHCR Push

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  version-and-build:
    runs-on: ubuntu-latest
    # Alleen dependency-updates (Renovate). Feature-bumps (v1.07) blijven handmatig.
    if: >
      github.actor == 'renovate[bot]' ||
      github.actor == 'renovate-bot' ||
      startsWith(github.event.head_commit.message, 'chore(deps)') ||
      startsWith(github.event.head_commit.message, 'fix(deps)') ||
      contains(github.event.head_commit.message, 'renovate')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bepaal laatste v1.XX.YY tag en bump alleen patch
        id: versioning
        run: |
          set -euo pipefail

          # Laatste tag die bij het schema past (negeer oude v.1.06-tags)
          LATEST_TAG=$(git tag -l 'v1.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 || true)
          if [ -z "${LATEST_TAG}" ]; then
            LATEST_TAG="v1.06.00"
          fi
          echo "Laatste tag: $LATEST_TAG"

          # v1.06 of v1.06.01 → major=1, feature=06, patch=00/01
          WITHOUT_V="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR FEATURE PATCH <<< "${WITHOUT_V}"
          FEATURE="${FEATURE:-0}"
          PATCH="${PATCH:-0}"

          FEATURE=$((10#$FEATURE))
          PATCH=$((10#$PATCH))
          PATCH=$((PATCH + 1))

          NEW_TAG=$(printf "v%d.%02d.%02d" "$MAJOR" "$FEATURE" "$PATCH")
          NEW_VERSION=$(printf "%d.%02d.%02d" "$MAJOR" "$FEATURE" "$PATCH")
          echo "Nieuwe tag: $NEW_TAG (version $NEW_VERSION)"

          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Sync package.json versions
        run: |
          set -euo pipefail
          for pkg in frontend/package.json backend/package.json; do
            if [ -f "$pkg" ]; then
              tmp=$(mktemp)
              jq --arg v "$NEW_VERSION" '.version = $v' "$pkg" > "$tmp"
              mv "$tmp" "$pkg"
            fi
          done

      - name: Commit version bump (if changed)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json backend/package.json
          if git diff --staged --quiet; then
            echo "Geen version-wijzigingen om te committen"
          else
            git commit -m "chore(release): ${NEW_TAG}"
            git push
          fi

      - name: Genereer GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${NEW_TAG}" \
            --generate-notes \
            --title "Release ${NEW_TAG}" \
            --notes "Automatic dependency update release (${NEW_TAG})."

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          # Eigenaar van de repo, niet renovate[bot] — nodig voor packages:write
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "REPO=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}:${{ env.NEW_TAG }}
            ghcr.io/${{ env.REPO }}:latest
